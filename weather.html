<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather application</title>
    <link rel="stylesheet" href="weather.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
/>

</head>
<body>
    


<div class="p1">
<div class="search">
<input class="searchBox" type="text" placeholder="search city">
<button class="b1"><i class="fa-solid fa-magnifying-glass"></i></button>
</div>


<div class="weather">
<img class="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQP1ivdulrNoX3rq2yZ2eiTk6x0nxQxTF9CXQ&s" alt="">
<h1 class="temp">22°C</h1>
<h2 class="city">Gujrat</h2>

<div class="details">
<img class="hm" src="humidity.png" alt="" width="60px">

<div class="col">
    <p class="humidity">50%</p>
    <p>Humidity</p>
</div>
</div>

<div class="details">
<img src="https://github.com/HassanBinIlyas/simple-weather-app/blob/main/assets/images/wind-icon.png?raw=true" alt="" width="80px">

<div class="col">
    <p class="wind">15 km/h</p>
    <p>wind speed</p>
</div>
</div>


</div>


</div>












<script src="weather.js"></script>
</body>
</html>
